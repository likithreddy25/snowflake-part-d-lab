name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  dbt-parse:
    name: dbt Parse (No Snowflake Connection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          pip install dbt-snowflake dbt-core --upgrade

      - name: Set up dbt profiles
        run: |
          cd dbt
          cp profiles.yml.template profiles.yml
        env:
          SNOWFLAKE_ACCOUNT: dummy_account
          SNOWFLAKE_USER: dummy_user
          SNOWFLAKE_ROLE: dummy_role
          SNOWFLAKE_WAREHOUSE: dummy_warehouse
          SNOWFLAKE_DATABASE: dummy_database
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/dummy_key
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: dummy_passphrase

      - name: dbt Parse
        run: |
          cd dbt
          dbt parse --profiles-dir .
        env:
          SNOWFLAKE_ACCOUNT: dummy_account
          SNOWFLAKE_USER: dummy_user
          SNOWFLAKE_ROLE: dummy_role
          SNOWFLAKE_WAREHOUSE: dummy_warehouse
          SNOWFLAKE_DATABASE: dummy_database
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/dummy_key
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: dummy_passphrase


  python-tests:
    name: Python Tests (Data Download Script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas pytest pytest-cov --upgrade

      - name: Run pytest
        run: |
          pytest tests/ -v --cov=scripts --cov-report=term

  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install flake8 black isort

      - name: Black format check
        run: |
          black --check scripts/ dbt/

      - name: isort import sorting
        run: |
          isort --profile black --check-only scripts/ dbt/

      - name: Flake8 linting
        run: |
          flake8 scripts/ dbt/ --max-line-length=100 --ignore=E203,E266,E501,W503
